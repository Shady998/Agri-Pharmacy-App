services:
  postgres:
    image: postgres:16-alpine
    container_name: agri-pharmacy-postgres
    environment:
      POSTGRES_DB: agri_pharmacy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri-network

  redis:
    image: redis:7-alpine
    container_name: agri-pharmacy-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: agri-pharmacy-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agri_pharmacy?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: dev-secret-change-in-production
      FRONTEND_URL: http://localhost
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agri-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: agri-pharmacy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agri-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  agri-network:
    driver: bridge